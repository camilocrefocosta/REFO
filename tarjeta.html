<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Cumpleaños - Dinámica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Mulish', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 1280px;
      height: 933px;
      position: relative;
      /* Reemplaza con la URL de tu imagen de fondo en GitHub */
      background-image: url('https://camilocrefocosta.github.io/REFO/fondo_tarjeta.jpg'); 
      background-size: cover;
      overflow: hidden;
    }
    /* CONTENEDOR MAESTRO: Aquí ocurre la magia del auto-ajuste */
    .info-wrapper {
      position: absolute;
      top: 510px; /* Punto de inicio vertical */
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .name {
      font-size: 38px;
      font-weight: 700;
      color: rgb(20, 170, 229);
      margin: 0;
      text-transform: uppercase;
    }
    .cargo {
      font-size: 26px;
      color: #00a3e0;
      margin: 5px 0 25px 0;
    }
    .mensaje {
      font-size: 22px;
      line-height: 1.4;
      font-style: italic;
      color: #003366;
      max-width: 800px;
      margin-bottom: 30px; /* Este espacio empuja la fecha hacia abajo */
    }
    .footer-data {
      font-style: normal;
      color: #00a3e0;
      font-size: 22px;
    }
    .empresa {
      font-weight: 700;
      color: rgb(20, 170, 229);
      font-size: 24px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="info-wrapper">
      <div class="name" id="name"></div>
      <div class="cargo" id="cargo"></div>
      <div class="mensaje">
        Que este día te regale momentos felices y recuerdos especiales junto a las personas que más quieres. ¡Disfrútalo mucho!
      </div>
      <div class="footer-data">
        <div id="fecha"></div>
        <div id="centro"></div>
        <div class="empresa" id="empresa"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    // Inyectar datos
    document.getElementById('name').textContent = params.get('name') || "COLABORADOR";
    document.getElementById('cargo').textContent = params.get('cargo') || "";
    document.getElementById('empresa').textContent = params.get('empresa') || "Refocosta S.A.S.";
    document.getElementById('centro').textContent = params.get('centro') || "";

    // Formatear Fecha
    const fechaParam = params.get('fecha');
    let d = fechaParam ? new Date(fechaParam + "T00:00:00") : new Date();
    const opciones = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('fecha').textContent = d.toLocaleDateString('es-CO', opciones);
  </script>
</body>
</html>
